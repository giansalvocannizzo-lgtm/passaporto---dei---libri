<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Il Passaporto dei Libri — Santa Briganti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
:root{--ink:#1F2A44;--ink-2:#2c3a5e;--paper:#EDE4D3;--paper-2:#E3D8C2;--kraft:#8B6F47;--red:#B23A2E;--green:#3F6B4C;--charcoal:#2B2620;--white-ish:#FBF7EE;--muted:#756b5d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);background-image:radial-gradient(circle at 20% 20%,rgba(139,111,71,.06) 0,transparent 45%),radial-gradient(circle at 80% 60%,rgba(31,42,68,.05) 0,transparent 40%);color:var(--charcoal);font-family:'Fraunces',serif;min-height:100vh}
.stamp-font{font-family:'Special Elite',monospace}
header.top{background:var(--ink);color:var(--white-ish);padding:20px 16px 18px;text-align:center;position:relative;border-bottom:4px solid var(--kraft)}
header.top .eyebrow{font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#C9BFA0;margin-bottom:6px}
header.top h1{margin:0;font-size:26px;font-weight:700;font-style:italic}
header.top .sub{margin-top:6px;font-size:12.5px;color:#D8CFB4;font-family:'Special Elite',monospace}
nav.tabs{display:flex;background:var(--paper-2);border-bottom:2px solid var(--kraft);position:sticky;top:0;z-index:20;overflow-x:auto}
nav.tabs button{flex:1;min-width:82px;padding:11px 4px;background:none;border:none;font-family:'Special Elite',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--kraft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--red);background:var(--paper)}
main{padding:16px;max-width:620px;margin:0 auto;padding-bottom:70px}
.card{background:var(--white-ish);border:1px solid rgba(139,111,71,.35);border-radius:3px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03);position:relative}
.card.clickable{cursor:pointer}.card.clickable:active{transform:translateY(1px)}
.card .title{font-size:17px;font-weight:600;margin:0 0 2px}.card .author{font-size:13px;color:var(--kraft);font-style:italic;margin:0 0 8px}
.badge{display:inline-block;font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:10px;border:1px solid currentColor}
.badge.disponibile{color:var(--green)}.badge.giro{color:var(--red)}.badge.neutro{color:var(--kraft)}
.meta{font-size:11.5px;color:var(--charcoal);opacity:.75;margin-top:7px;font-family:'Special Elite',monospace;line-height:1.45}
.empty{text-align:center;padding:40px 20px;color:var(--kraft);font-family:'Special Elite',monospace;font-size:13px}
button.primary,button.secondary,button.danger{padding:11px 14px;font-family:'Special Elite',monospace;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;cursor:pointer;width:100%}
button.primary{background:var(--ink);color:var(--white-ish);border:1px solid var(--ink)}button.primary.red{background:var(--red);border-color:var(--red)}button.primary.green{background:var(--green);border-color:var(--green)}
button.secondary{background:none;border:1px solid var(--kraft);color:var(--kraft)}button.danger{background:none;border:1px solid var(--red);color:var(--red)}
.btn-row{display:flex;gap:8px;margin-top:10px}.btn-row>*{flex:1}
input,select,textarea{width:100%;padding:10px;font-family:'Fraunces',serif;font-size:14px;border:1px solid var(--kraft);border-radius:2px;background:var(--white-ish);color:var(--charcoal);margin-bottom:10px}
label{font-family:'Special Elite',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--kraft);display:block;margin-bottom:4px}
.small{font-size:11px;color:var(--muted);line-height:1.45}.center{text-align:center}.mt8{margin-top:8px}.mt12{margin-top:12px}
.whoami{background:var(--white-ish);border:1px solid var(--kraft);border-radius:2px;padding:8px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.whoami b{font-family:'Special Elite',monospace;color:var(--ink)}.whoami button{background:none;border:none;color:var(--red);font-family:'Special Elite',monospace;font-size:11px;cursor:pointer;text-decoration:underline}
.hero{background:var(--ink);color:var(--white-ish);padding:20px 16px;border-radius:3px;margin-bottom:14px;border:2px solid var(--ink)}
.hero h2{margin:0 0 6px;font-size:23px;font-style:italic}.hero p{margin:0;color:#D8CFB4;font-size:13px;line-height:1.5}
.hero-actions{display:flex;gap:8px;margin-top:15px}.hero-actions button{flex:1}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--white-ish);border:1px solid rgba(139,111,71,.35);padding:12px;text-align:center}.stat .n{font-size:25px;font-weight:600;color:var(--ink)}.stat .l{font-family:'Special Elite',monospace;font-size:9.5px;text-transform:uppercase;color:var(--kraft);letter-spacing:.05em}
.section-title{font-family:'Special Elite',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--kraft);border-bottom:1px dashed var(--kraft);padding-bottom:6px;margin:18px 0 12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters>*{margin-bottom:0}
.passport{background:var(--white-ish);border:2px solid var(--ink);border-radius:3px;overflow:hidden}
.passport-cover{background:var(--ink);color:var(--white-ish);padding:20px 16px;text-align:center}.passport-cover .eyebrow{font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#C9BFA0;margin-bottom:8px}.passport-cover h2{margin:0;font-size:22px;font-style:italic}.passport-cover .author{margin-top:4px;font-size:13px;color:#D8CFB4}
.passport-body{padding:16px}.status-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper-2);border:1px dashed var(--kraft);padding:10px 12px;border-radius:2px;margin-bottom:10px;font-size:13px}.status-row .label{font-family:'Special Elite',monospace;font-size:9.5px;color:var(--kraft);text-transform:uppercase;margin-bottom:2px}
.timeline{margin-top:16px}.timeline h3{font-family:'Special Elite',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--kraft);border-bottom:1px dashed var(--kraft);padding-bottom:6px;margin-bottom:14px}
.stamp{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}.stamp-badge{flex-shrink:0;width:56px;height:56px;border-radius:50%;border:2px dashed var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Special Elite',monospace;font-size:8.5px;text-align:center;text-transform:uppercase;transform:rotate(-8deg);line-height:1.1}.stamp-badge.posizione{border-color:var(--kraft);color:var(--kraft);transform:rotate(6deg)}.stamp-badge.restituzione{border-color:var(--green);color:var(--green);transform:rotate(4deg)}.stamp-badge.traccia{border-color:var(--ink);color:var(--ink);transform:rotate(-3deg)}
.stamp-text{font-size:13px;line-height:1.4}.stamp-text .who{font-weight:600}.stamp-text .when{font-family:'Special Elite',monospace;font-size:10px;color:var(--kraft);margin-top:2px}.stamp-text .note{font-style:italic;font-size:12px;margin-top:3px;color:var(--charcoal);opacity:.85}
.qr-box{background:var(--white-ish);border:1px solid var(--kraft);padding:14px;text-align:center;border-radius:2px;margin-top:14px}.qr-box img,.qr-box canvas{margin:0 auto}.qr-label{font-family:'Special Elite',monospace;font-size:10px;color:var(--kraft);margin-top:8px}
.back-link{background:none;border:none;color:var(--kraft);font-family:'Special Elite',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;margin-bottom:12px;padding:0}
#scanner-video{width:100%;border-radius:3px;border:2px solid var(--ink);background:#000}.scan-hint{text-align:center;font-family:'Special Elite',monospace;font-size:11px;color:var(--kraft);margin-top:10px}
.cover-preview{max-width:180px;max-height:240px;display:block;margin:10px auto;border:1px solid var(--kraft);object-fit:cover}.ai-box{background:var(--paper-2);border:1px dashed var(--kraft);padding:12px;margin:10px 0}.ai-status{font-family:'Special Elite',monospace;font-size:11px;color:var(--kraft);margin-top:6px}.description{line-height:1.5}..toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white-ish);padding:10px 18px;border-radius:3px;font-family:'Special Elite',monospace;font-size:12px;z-index:100;opacity:0;transition:opacity .25s;max-width:90%;text-align:center;pointer-events:none}.toast.show{opacity:1}
.print-label{background:var(--white-ish);border:2px solid var(--ink);border-radius:3px;padding:18px;text-align:center;margin-top:14px}.print-label h4{margin:10px 0 2px;font-size:16px}.print-label .plabel-author{font-style:italic;color:var(--kraft);font-size:12.5px;margin-bottom:10px}.instructions{font-family:'Special Elite',monospace;font-size:10.5px;color:var(--charcoal);border-top:1px dashed var(--kraft);margin-top:12px;padding-top:10px;line-height:1.5;text-align:left}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--kraft);border-radius:12px;padding:4px 8px;font-family:'Special Elite',monospace;font-size:9.5px;color:var(--kraft)}
.journey-box{background:var(--paper-2);padding:12px;border:1px dashed var(--kraft);margin-top:10px}.journey-big{font-size:24px;color:var(--ink);font-weight:600}.journey-list{font-family:'Special Elite',monospace;font-size:10px;color:var(--kraft);line-height:1.7}
@media print{body *{visibility:hidden}#printable-label,#printable-label *{visibility:visible}#printable-label{position:absolute;top:0;left:0;width:100%;border:none}#print-btn{display:none}}
@media(min-width:700px){main{max-width:760px}.stat-grid{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:2fr 1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Associazione Santa Briganti</div>
  <h1>Il Passaporto dei Libri</h1>
  <div class="sub">ogni libro racconta il suo viaggio</div>
</header>
<nav class="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="catalogo">Catalogo</button>
  <button data-tab="scansiona">Scansiona</button>
  <button data-tab="soci">Soci</button>
  <button data-tab="viaggi">Viaggi</button>
  <button data-tab="aggiungi">Gestore</button>
</nav>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* CONFIGURAZIONE */
const APP_URL = ''; // es. https://passaporto-libri-santabriganti.it
const STORAGE_SHARED = true;
const GESTORE_PIN_KEY = 'gestore-pin-hash-v2';
const BOOK_INDEX_KEY = 'books-index-v2';
const MEMBERS_KEY = 'members-v2';

let state={
  tab:'home', currentMember:null, members:[], index:[], openBookId:null, openMemberId:null,
  scanning:false, scanStream:null, isGestore:false, visitor:true
};

function uid(prefix){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function bookCode(index){return 'PB-'+String(index).padStart(6,'0')}
function escapeHtml(s){if(s===null||s===undefined)return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
async function getVal(key,shared=STORAGE_SHARED){try{const r=await window.storage.get(key,shared);return r?JSON.parse(r.value):null}catch(e){console.error(e);return null}}
async function setVal(key,value,shared=STORAGE_SHARED){try{await window.storage.set(key,JSON.stringify(value),shared)}catch(e){console.error('storage set error',e);showToast('Errore di salvataggio')}}
async function loadIndex(){return (await getVal(BOOK_INDEX_KEY))||[]}
async function saveIndex(v){await setVal(BOOK_INDEX_KEY,v)}
async function loadBook(id){return await getVal('book:'+id)}
async function saveBook(b){await setVal('book:'+b.id,b)}
async function loadMembers(){return (await getVal(MEMBERS_KEY))||[]}
async function saveMembers(v){await setVal(MEMBERS_KEY,v)}
async function hashPin(pin){const data=new TextEncoder().encode(pin);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}

function formatDate(iso){try{return new Date(iso).toLocaleString('it-IT',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return iso}}
function formatDateOnly(iso){if(!iso)return '';try{return new Date(iso+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}catch{return iso}}
function currentBookUrl(id){return APP_URL?APP_URL.replace(/\/$/,'')+'/libro/'+encodeURIComponent(id):id}
function parseBookId(value){
  if(!value)return '';
  try{
    const u=new URL(value,location.href);
    const m=u.pathname.match(/\/libro\/([^/]+)/);
    if(m)return decodeURIComponent(m[1]);
    const q=u.searchParams.get('libro')||u.searchParams.get('id');
    if(q)return q;
  }catch{}
  return value.trim();
}
function unique(arr){return [...new Set(arr.filter(Boolean))]}
function getBookById(id){return state.index.find(x=>x.id===id)}
function nextBookCode(){return bookCode(state.index.length+1)}

async function init(){
  state.members=await loadMembers();
  state.index=await loadIndex();
  await hydrateCache();
  const urlId=new URLSearchParams(location.search).get('libro');
  if(urlId) state.openBookId=parseBookId(urlId);
  render();
}
document.querySelectorAll('nav.tabs button').forEach(btn=>btn.addEventListener('click',()=>{
  stopScanner(); state.tab=btn.dataset.tab; state.openBookId=null; state.openMemberId=null;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b===btn)); render();
}));

function render(){
  const app=document.getElementById('app');
  let html='';
  if(state.currentMember) html+=renderWhoAmIBar();
  if(state.openBookId){app.innerHTML=html+renderBookDetailShell();loadAndRenderBookDetail(state.openBookId);attachCommonHandlers();return}
  if(state.openMemberId){app.innerHTML=html+`<button class="back-link" id="back-member">‹ torna ai soci</button><div id="member-detail-area"><div class="empty">Carico...</div></div>`;attachCommonHandlers();document.getElementById('back-member').onclick=()=>{state.openMemberId=null;render()};loadAndRenderMemberDetail(state.openMemberId);return}
  if(state.tab==='home')html+=renderHome();
  else if(state.tab==='catalogo')html+=renderCatalogo();
  else if(state.tab==='scansiona')html+=renderScansiona();
  else if(state.tab==='soci')html+=renderSoci();
  else if(state.tab==='viaggi')html+=renderViaggi();
  else if(state.tab==='aggiungi')html+=renderAggiungi();
  app.innerHTML=html;attachCommonHandlers();
}
function attachCommonHandlers(){
  const switchBtn=document.getElementById('switch-member');if(switchBtn)switchBtn.onclick=()=>{state.currentMember=null;render()};
  const identify=document.querySelectorAll('[data-identify]');identify.forEach(b=>b.onclick=()=>{state.tab='home';state.openBookId=null;renderWhoPrompt()});
  document.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>{state.openBookId=el.dataset.book;render()});
  document.querySelectorAll('[data-member]').forEach(el=>el.onclick=()=>{state.openMemberId=el.dataset.member;render()});
  const search=document.getElementById('search-box');if(search)search.oninput=filterCards;
  const searchS=document.getElementById('search-soci');if(searchS)searchS.oninput=filterCards;
  const cat=document.getElementById('filter-genre');if(cat)cat.onchange=filterCards;
  const status=document.getElementById('filter-status');if(status)status.onchange=filterCards;
  attachScanHandlers();attachAddHandlers();
}
function filterCards(){
  const q=(document.getElementById('search-box')?.value||document.getElementById('search-soci')?.value||'').toLowerCase();
  document.querySelectorAll('#catalogo-list .card').forEach(c=>{
    const text=c.textContent.toLowerCase();
    const genre=document.getElementById('filter-genre')?.value||'';
    const status=document.getElementById('filter-status')?.value||'';
    const okQ=!q||text.includes(q), okG=!genre||c.dataset.genre===genre, okS=!status||c.dataset.status===status;
    c.style.display=okQ&&okG&&okS?'':'none';
  });
  document.querySelectorAll('#soci-list .card').forEach(c=>c.style.display=!q||c.textContent.toLowerCase().includes(q)?'':'none');
}
function renderWhoAmIBar(){return `<div class="whoami"><span>Accesso come <b>${escapeHtml(state.currentMember.name)}</b></span><button id="switch-member">cambia</button></div>`}
function renderHome(){
  const total=state.index.length, available=state.index.filter(b=>b.status==='disponibile').length, inTrip=total-available;
  const readers=new Set(state.index.map(b=>b.holderId).filter(Boolean)).size;
  return `<div class="hero">
    <h2>Il libro non sta fermo.</h2>
    <p>Ogni volume entra nel circuito, passa di mano in mano e costruisce la propria storia.</p>
    <div class="hero-actions"><button class="primary" id="hero-catalogo">Esplora i libri</button><button class="secondary" id="hero-scan">Scansiona un QR</button></div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="n">${total}</div><div class="l">Libri</div></div>
    <div class="stat"><div class="n">${available}</div><div class="l">Disponibili</div></div>
    <div class="stat"><div class="n">${inTrip}</div><div class="l">In viaggio</div></div>
    <div class="stat"><div class="n">${state.members.length}</div><div class="l">Soci</div></div>
  </div>
  <div class="section-title">Ultimi movimenti</div>
  ${renderRecentEvents(5)}
  <div class="card center"><div class="title">Sei un socio?</div><div class="small">Identificati per prendere, restituire o aggiornare un libro.</div><button class="primary mt12" id="identify-home">Identificati</button></div>`;
}
function renderRecentEvents(limit){
  const rows=[];
  for(const e of state.index){const b=state._bookCache?.[e.id];if(b)b.events?.forEach(ev=>rows.push({book:b,ev}))}
  if(!rows.length)return `<div class="empty">Nessun movimento registrato ancora.</div>`;
  rows.sort((a,b)=>new Date(b.ev.at)-new Date(a.ev.at));
  return rows.slice(0,limit).map(r=>`<div class="card clickable" data-book="${r.book.id}"><div class="title">${escapeHtml(r.book.title)}</div><div class="meta">${eventShort(r.ev)}</div></div>`).join('');
}
function eventShort(ev){
  if(ev.type==='prestito')return `Prestito: ${escapeHtml(ev.fromName||'')} → ${escapeHtml(ev.toName||'')}${ev.city?' · '+escapeHtml(ev.city):''} · ${formatDate(ev.at)}`;
  if(ev.type==='restituzione')return `Restituito da ${escapeHtml(ev.fromName||'')} · ${formatDate(ev.at)}`;
  if(ev.type==='posizione')return `Posizione: ${escapeHtml(ev.note||'')}${ev.city?' · '+escapeHtml(ev.city):''} · ${formatDate(ev.at)}`;
  if(ev.type==='traccia')return `Traccia di ${escapeHtml(ev.fromName||'')} · ${formatDate(ev.at)}`;
  return `Registrato · ${formatDate(ev.at)}`;
}
async function hydrateCache(){
  state._bookCache={};for(const e of state.index){const b=await loadBook(e.id);if(b)state._bookCache[e.id]=b}
}
function renderCatalogo(){
  const genres=unique(state.index.map(b=>b.genre)).sort();
  const cards=state.index.slice().sort((a,b)=>a.title.localeCompare(b.title,'it')).map(b=>`
    <div class="card clickable" data-book="${b.id}" data-genre="${escapeHtml(b.genre||'')}" data-status="${b.status}">
      <div class="title">${escapeHtml(b.title)}</div><div class="author">${escapeHtml(b.author||'Autore sconosciuto')}</div>
      <span class="badge ${b.status==='disponibile'?'disponibile':'giro'}">${b.status==='disponibile'?'Disponibile':'In viaggio'}</span>
      <div class="meta">${b.status==='disponibile'?'Presso: '+escapeHtml(b.holderName||'circuito'):'Con: '+escapeHtml(b.holderName||'?')}${b.location?' · '+escapeHtml(b.location):''}${b.code?' · '+escapeHtml(b.code):''}</div>
    </div>`).join('');
  return `<div class="section-title">Catalogo</div>
    <input id="search-box" placeholder="Cerca titolo, autore, genere o codice...">
    <div class="filters"><select id="filter-genre"><option value="">Tutti i generi</option>${genres.map(g=>`<option>${escapeHtml(g)}</option>`).join('')}</select><select id="filter-status"><option value="">Tutti gli stati</option><option value="disponibile">Disponibili</option><option value="in_giro">In viaggio</option></select></div>
    <div id="catalogo-list" class="mt12">${cards||'<div class="empty">Nessun libro ancora registrato.</div>'}</div>`;
}
function renderScansiona(){
 return `<div class="card"><div class="title">Scansiona un QR</div><video id="scanner-video" playsinline></video><canvas id="scanner-canvas" style="display:none"></canvas><div class="scan-hint">Inquadra il QR applicato sul libro.</div><div class="btn-row"><button class="primary" id="start-scan">Avvia fotocamera</button><button class="secondary" id="pick-qr">Scegli una foto</button></div><input type="file" id="qr-file" accept="image/*" capture="environment" style="display:none"></div>`;
}
function attachScanHandlers(){
 const start=document.getElementById('start-scan');if(start)start.onclick=startScanner;
 const pick=document.getElementById('pick-qr'),file=document.getElementById('qr-file');
 if(pick&&file){pick.onclick=()=>file.click();file.onchange=()=>scanImageFile(file.files[0])}
}
async function startScanner(){

async function withBookLock(bookId, action){
  const run=async()=>{
    const latest=await loadBook(bookId);
    if(!latest){showToast('Libro non trovato');return}
    return await action(latest);
  };
  if(navigator.locks?.request){
    return await navigator.locks.request('passaporto-book-'+bookId,{mode:'exclusive'},run);
  }
  // Fallback: re-read immediately before writing. This protects against stale local state,
  // but cannot provide a true cross-device transaction; production should use a backend CAS/transaction.
  return await run();
}

let ocrWorkerPromise=null, tesseractLoadPromise=null;
async function ensureTesseract(){
 if(window.Tesseract)return window.Tesseract;
 if(!tesseractLoadPromise){
  tesseractLoadPromise=new Promise((resolve,reject)=>{
   const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
   sc.onload=()=>resolve(window.Tesseract);sc.onerror=()=>reject(new Error('Tesseract non disponibile'));document.head.appendChild(sc);
  });
 }
 return tesseractLoadPromise;
}
async function getOCRWorker(){
 if(!ocrWorkerPromise){
  const T=await ensureTesseract();
  ocrWorkerPromise=T.createWorker('ita+eng',1,{logger:m=>{const st=document.getElementById('cover-status');if(st&&m.progress)st.textContent='OCR copertina: '+Math.round(m.progress*100)+'%';}});
 }
 return ocrWorkerPromise;
}
async function prepareOCRImage(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{
   const max=1400,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));
   const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,c.width,c.height);
   const data=ctx.getImageData(0,0,c.width,c.height),p=data.data;
   for(let i=0;i<p.length;i+=4){const g=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114);p[i]=p[i+1]=p[i+2]=g>160?255:0;}
   ctx.putImageData(data,0,0);c.toBlob(b=>b?resolve(b):reject(new Error('conversione immagine fallita')),'image/jpeg',0.78);
  };im.src=r.result};r.readAsDataURL(file);
 });
}
async function processCover(file){
 if(!file)return;const status=document.getElementById('cover-status'),preview=document.getElementById('cover-preview');status.textContent='Preparo la copertina…';
 try{
  const ocrBlob=await prepareOCRImage(file);
  const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const max=700,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',0.72);preview.src=data;preview.dataset.image=data;preview.style.display='block'};im.src=reader.result};reader.readAsDataURL(file);
  status.textContent='Avvio OCR rapido…';
  const worker=await getOCRWorker();
  const result=await worker.recognize(ocrBlob);
  const text=result.data.text.replace(/\s+/g,' ').trim();const parsed=parseCoverText(text);
  if(parsed.title&&!document.getElementById('new-title').value)document.getElementById('new-title').value=parsed.title;
  if(parsed.author&&!document.getElementById('new-author').value)document.getElementById('new-author').value=parsed.author;
  status.textContent=text?'Testo riconosciuto. Controlla titolo e autore, poi avvia la ricerca online.':'Nessun testo leggibile: inserisci titolo e autore manualmente.';
 }catch(e){console.error(e);status.textContent='OCR non disponibile. Inserisci titolo e autore manualmente.'}
}
function parseCoverText(text){const lines=text.split(/[|·•]+|\s{2,}/).map(x=>x.trim()).filter(x=>x.length>1);let author='';const authorLine=lines.find(x=>/^(di|by)\s+/i.test(x));if(authorLine)author=authorLine.replace(/^(di|by)\s+/i,'').trim();let title=lines.find(x=>x!==authorLine&&x.length>2&&!/isbn|edizioni|editore|romanzo|collana/i.test(x))||'';if(!author){const m=text.match(/(?:di|by)\s+([A-ZÀ-ÖØ-Ý][^,.;|]+)/i);if(m)author=m[1].trim()}return {title,author}}
async function lookupBookOnline(){
 const title=document.getElementById('new-title').value.trim(),author=document.getElementById('new-author').value.trim(),status=document.getElementById('cover-status');if(!title){showToast('Inserisci o fotografa prima il titolo');return}status.textContent='Ricerca online di metadati e descrizione…';
 try{
  const q=encodeURIComponent('intitle:'+title+(author?' inauthor:'+author:''));
  let item=null;
  try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+q+'&maxResults=5&langRestrict=it');const data=await r.json();item=data.items?.[0]||null}catch(e){}
  if(item){const v=item.volumeInfo||{};if(!document.getElementById('new-author').value&&v.authors?.length)document.getElementById('new-author').value=v.authors.join(', ');if(!document.getElementById('new-genre').value&&v.categories?.length)document.getElementById('new-genre').value=v.categories[0];if(v.description)document.getElementById('new-description').value=stripHtml(v.description);if(v.imageLinks?.thumbnail){const preview=document.getElementById('cover-preview');if(!preview.dataset.image){preview.src=v.imageLinks.thumbnail;preview.style.display='block'}}status.textContent="Dati trovati. Verifica sempre la corrispondenza con l'edizione fotografata.";return}
  const ol=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(title)+(author?'&author='+encodeURIComponent(author):'')+'&limit=5');const od=await ol.json();const d=od.docs?.[0];if(!d)throw new Error('Nessun risultato');if(!document.getElementById('new-author').value&&d.author_name?.length)document.getElementById('new-author').value=d.author_name[0];if(!document.getElementById('new-genre').value&&d.subject?.length)document.getElementById('new-genre').value=d.subject[0];if(d.cover_i&&!document.getElementById('cover-preview').dataset.image){const preview=document.getElementById('cover-preview');preview.src='https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg';preview.style.display='block'}status.textContent='Metadati trovati. Per la descrizione, verifica una fonte editoriale o libraria se il campo è vuoto.';
 }catch(e){console.error(e);status.textContent='Ricerca automatica non riuscita. Prova con titolo e autore più precisi.'}}
function stripHtml(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent||d.innerText||s}

function renderPrintableLabel(book){
 const area=document.getElementById('new-qr-area');area.innerHTML=`<div class="print-label" id="printable-label"><div style="color:var(--kraft);font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase">Santa Briganti · Il Passaporto dei Libri</div><div id="qr-render"></div><h4>${escapeHtml(book.title)}</h4><div class="plabel-author">${escapeHtml(book.author||'')}</div><div class="pill">${escapeHtml(book.code)}</div><div class="instructions">Scansiona questo QR per aprire direttamente il passaporto del libro e registrare il suo viaggio.</div></div><button class="secondary" id="print-btn" style="margin-top:10px">Stampa etichetta</button>`;
 new QRCode(document.getElementById('qr-render'),{text:currentBookUrl(book.id),width:150,height:150,colorDark:'#1F2A44',colorLight:'#FBF7EE'});document.getElementById('print-btn').onclick=()=>window.print()
}

function renderWhoPrompt(){
 const opts=state.members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
 const app=document.getElementById('app');app.innerHTML=`<div class="card"><div class="title">Identificati</div><div class="author">Serve solo per registrare le azioni sul circuito.</div><label>Socio esistente</label><select id="member-select"><option value="">— scegli —</option>${opts}</select><button class="primary" id="confirm-member">Continua</button><div class="center small" style="margin:14px">— oppure —</div><label>Nuovo socio</label><input id="new-member-name" placeholder="Nome e cognome"><input id="new-member-city" placeholder="Città"><input id="new-member-email" type="email" placeholder="Email privata, opzionale"><button class="secondary" id="add-member">Registrami</button></div>`;
 document.getElementById('confirm-member').onclick=()=>{const m=state.members.find(x=>x.id===document.getElementById('member-select').value);if(!m){showToast('Seleziona un socio');return}state.currentMember=m;render()};
 document.getElementById('add-member').onclick=async()=>{const name=document.getElementById('new-member-name').value.trim();if(!name){showToast('Inserisci il nome');return}const m={id:uid('mem'),name,city:document.getElementById('new-member-city').value.trim(),email:document.getElementById('new-member-email').value.trim()};state.members.push(m);await saveMembers(state.members);state.currentMember=m;render()}
}
document.getElementById('app').addEventListener('click',async e=>{
 if(e.target.id==='hero-catalogo'){state.tab='catalogo';render()}
 if(e.target.id==='hero-scan'){state.tab='scansiona';render()}
 if(e.target.id==='identify-home')renderWhoPrompt()
});
/* Aggiorna le statistiche della home caricando gli eventi senza bloccare l'avvio */
const oldRender=render;
render=async function(){
  await hydrateCache();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  oldRender();
  if(state.tab==='viaggi'&&!state.openBookId&&!state.openMemberId){
    const area=document.getElementById('journey-area');
    if(area)area.innerHTML=await buildJourneyHtml();
  }
}
init();
