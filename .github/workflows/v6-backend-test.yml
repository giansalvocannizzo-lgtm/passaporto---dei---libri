name: V6 backend test

on:
  push:
    branches:
      - v6-backend-shared-archive
  pull_request:
    branches:
      - main
      - v6-backend-shared-archive
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Structural backend test
        run: npm run test:backend
