name: V6 backend test

on:
  push:
    branches:
      - v6-backend-shared-archive
  pull_request:
    branches:
      - main
      - v6-backend-shared-archive
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v6test
          POSTGRES_PASSWORD: v6test
          POSTGRES_DB: v6test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U v6test -d v6test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://v6test:v6test@localhost:5432/v6test
      AUTH_SECRET: ci-test-auth-secret
      ADMIN_PASSWORD: ci-test-admin-password
      DB_SSL: "false"
      CORS_ORIGIN: "*"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Backend integration and concurrency test
        run: npm run test:backend
